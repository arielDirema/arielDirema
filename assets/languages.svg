<svg xmlns="http://www.w3.org/2000/svg" width="400" height="180" viewBox="0 0 400 180" role="img" aria-label="Most used languages">
  <title>Most used languages</title>
  <style>
    .t { font: 600 16px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #ffffff; }
    .l { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #8b949e; }
    .v { font: 700 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #ffffff; }
    .s { font: 400 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #8b949e; }
    .fade { animation: fade .6s ease both; }
    @keyframes fade { from { opacity: 0; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <rect x="0.5" y="0.5" rx="12" width="399" height="179" fill="#000000" stroke="#30363d"/>
  <rect x="24" y="22" width="34" height="10" rx="5" fill="#000" stroke="#3d444d"/>
  <circle cx="51" cy="27" r="2.6" fill="#4cc2ff"/>
  <text x="68" y="32" class="t">Most used languages</text>
  <clipPath id="bar"><rect x="24" y="52" width="352" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)" style="transform-origin:24px 0;animation:grow .9s ease">
    <rect x="24.00" y="52" width="252.28" height="10" fill="#3572A5"/>
    <rect x="275.78" y="52" width="25.29" height="10" fill="#f7523f"/>
    <rect x="300.57" y="52" width="24.15" height="10" fill="#4F5D95"/>
    <rect x="324.22" y="52" width="21.98" height="10" fill="#3178c6"/>
    <rect x="345.70" y="52" width="12.22" height="10" fill="#A97BFF"/>
    <rect x="357.42" y="52" width="6.92" height="10" fill="#DA5B0B"/>
    <rect x="363.83" y="52" width="12.67" height="10" fill="#6e7681"/>
  </g>
  <g class="fade" style="animation-delay:300ms"><circle cx="29" cy="84" r="5" fill="#3572A5"/><text x="40" y="88" class="l">Python</text><text x="192" y="88" class="v" text-anchor="end">71.5%</text></g>
  <g class="fade" style="animation-delay:390ms"><circle cx="209" cy="84" r="5" fill="#f7523f"/><text x="220" y="88" class="l">Blade</text><text x="372" y="88" class="v" text-anchor="end">7.0%</text></g>
  <g class="fade" style="animation-delay:480ms"><circle cx="29" cy="108" r="5" fill="#4F5D95"/><text x="40" y="112" class="l">PHP</text><text x="192" y="112" class="v" text-anchor="end">6.7%</text></g>
  <g class="fade" style="animation-delay:570ms"><circle cx="209" cy="108" r="5" fill="#3178c6"/><text x="220" y="112" class="l">TypeScript</text><text x="372" y="112" class="v" text-anchor="end">6.1%</text></g>
  <g class="fade" style="animation-delay:660ms"><circle cx="29" cy="132" r="5" fill="#A97BFF"/><text x="40" y="136" class="l">Kotlin</text><text x="192" y="136" class="v" text-anchor="end">3.3%</text></g>
  <g class="fade" style="animation-delay:750ms"><circle cx="209" cy="132" r="5" fill="#DA5B0B"/><text x="220" y="136" class="l">Jupyter Notebook</text><text x="372" y="136" class="v" text-anchor="end">1.8%</text></g>
  <g class="fade" style="animation-delay:840ms"><circle cx="29" cy="156" r="5" fill="#6e7681"/><text x="40" y="160" class="l">Other</text><text x="192" y="160" class="v" text-anchor="end">3.5%</text></g>
</svg>
