<svg xmlns="http://www.w3.org/2000/svg" width="400" height="202" viewBox="0 0 400 202" role="img" aria-label="GitHub stats">
  <title>GitHub stats</title>
  <style>
    .t { font: 600 16px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #ffffff; }
    .l { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #8b949e; }
    .v { font: 700 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #ffffff; }
    .s { font: 400 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #8b949e; }
    .fade { animation: fade .6s ease both; }
    @keyframes fade { from { opacity: 0; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <rect x="0.5" y="0.5" rx="12" width="399" height="201" fill="#000000" stroke="#30363d"/>
  <rect x="24" y="22" width="34" height="10" rx="5" fill="#000" stroke="#3d444d"/>
  <circle cx="51" cy="27" r="2.6" fill="#4cc2ff"/>
  <text x="68" y="32" class="t">GitHub stats</text>
  <g class="fade" style="animation-delay:0ms"><path fill="none" stroke="#4cc2ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M29 52h8a2 2 0 0 1 2 2v10H31a2 2 0 0 1-2-2z M29 62a2 2 0 0 1 2-2h8"/><text x="52" y="62" class="l">Public repositories</text><text x="370" y="62" class="v" text-anchor="end">7</text></g>
  <g class="fade" style="animation-delay:120ms"><polygon fill="none" stroke="#4cc2ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" points="34.0 79.5 35.8 84.1 40.7 84.3 36.9 87.4 38.1 92.2 34.0 89.5 29.9 92.2 31.1 87.4 27.3 84.3 32.2 84.1"/><text x="52" y="90" class="l">Stars earned</text><text x="370" y="90" class="v" text-anchor="end">18</text></g>
  <g class="fade" style="animation-delay:240ms"><circle fill="none" stroke="#4cc2ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" cx="32" cy="111" r="3"/><path fill="none" stroke="#4cc2ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M27 120c0-3 2.2-5 5-5s5 2 5 5 M37 108.5a3 3 0 0 1 0 5.5 M39 115.5c1.4.8 2.2 2.4 2.2 4.5"/><text x="52" y="118" class="l">Followers</text><text x="370" y="118" class="v" text-anchor="end">11</text></g>
  <g class="fade" style="animation-delay:360ms"><path fill="none" stroke="#4cc2ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M34 149c-3.3 0-5-2.2-5-4.8 0-3.4 3.2-4.6 3.2-8.2 2.8 1.6 4.3 4.1 3.8 6.6.9-.6 1.5-1.6 1.6-2.6 1.5 1.3 2.4 3 2.4 4.6 0 2.4-2 4.4-5 4.4z"/><text x="52" y="146" class="l">Contributions (last year)</text><text x="370" y="146" class="v" text-anchor="end">29</text></g>
  <g class="fade" style="animation-delay:480ms"><circle fill="none" stroke="#4cc2ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" cx="34" cy="170" r="3"/><path fill="none" stroke="#4cc2ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M27 170h4 M37 170h4"/><text x="52" y="174" class="l">Commits (last year)</text><text x="370" y="174" class="v" text-anchor="end">26</text></g>
